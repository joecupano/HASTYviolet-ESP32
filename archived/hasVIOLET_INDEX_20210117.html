/*
 -
 - Index Module CSS   20201224-2300
 - 
*/

/* ------- grid container ------- */

.grid-container {
  display: grid;
  width: 948px;
  grid-template-areas:
  'tuner-container rx-container'
  'radio-controls-container rx-container'
  'cmd-controls-container rx-container'
  'msg-controls-container tx-container';
  grid-gap: 16px;
  background-color: black;
  border-radius: 12px;
  padding: 16px;
}

.tuner-container {
  grid-area: tuner-container;
  width: 256px;
  grid-gap: 16px;
  background-color: black;
  border-radius: 12px;
  padding: 8px;
}

.radio-controls-container {
  grid-area: radio-controls-container;
  width: 256px;
  grid-gap: 8px;
  background-color: black;
  border-radius: 12px;
  padding: 8px;
}

.cmd-controls-container {
  grid-area: cmd-controls-container;
  width: 256px;
  grid-gap: 8px;
  background-color: black;
  border-radius: 12px;
  padding: 8px;
}

.msg-controls-container {
  grid-area: msg-controls-container;
  width: 256px;
  grid-gap: 8px;
  background-color: black;
  border-radius: 12px;
  padding: 8px;
}

.rx-container {
  grid-area: rx-container;
  width: 692px;
  grid-template-columns: auto;
  grid-gap: 16px;
  background-color: black;
  border-radius: 12px;
  padding: 16px;
}

.tx-container {
  grid-area: tx-container;
  width: 692px;
  grid-template-columns: auto;
  grid-gap: 16px;
  background-color: black;
  border-radius: 12px;
  padding: 16px;
}

/*
 -
 - Tuner Container CSS   20201231-0300
 - 
*/

.tuner-main { /* center / center */
	position: absolute;
}
.tuner-small {
	margin-left: -130px;
}

.tuner-main {
	display: block;
	/* width: 480px; */ /* only needed in Chrome extension */
	padding: 16px 10px 18px;
	font: bold 15px/28px Arial, Helvetica, sans-serif;
	border-radius: 12px;
	box-shadow:
		inset  0px -38px 5px rgba(  0,   0,   0, 0.8),
		inset  0px   6px 4px rgba(255, 255, 255, 0.25),
		inset  0px   2px 1px rgba(255, 255, 255, 0.25),
		inset  3px   0px 3px rgba(255, 255, 255, 0.25),
		inset -4px   0px 4px rgba(  0,   0,   0, 0.75);
	background: #141414; /* Old browsers */
	background: -moz-linear-gradient(top,  #141414 45%, #282828 80%); /* FF3.6+ */
	background: -webkit-gradient(linear, left top, left bottom, color-stop(45%,#141414), color-stop(80%,#282828)); /* Chrome,Safari4+ */
	background: -webkit-linear-gradient(top,  #141414 45%,#282828 80%); /* Chrome10+,Safari5.1+ */
	background: -o-linear-gradient(top,  #141414 45%,#282828 80%); /* Opera 11.10+ */
	background: -ms-linear-gradient(top,  #141414 45%,#282828 80%); /* IE10+ */
	background: linear-gradient(to bottom,  #141414 45%,#282828 80%); /* W3C */
	filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#141414', endColorstr='#282828',GradientType=0 ); /* IE6-9 */
}
.tuner-main:after {
	content: "";
	display: block;
	clear: both;
}
.tuner-small {
	/* width: 240px; */ /* only needed in Chrome extension */
}

/* --------- display --------- */

.tuner-display {
	position: relative;
	height: 60px;
	margin: 0 5px 6px 5px;
	padding: 0 8px;
	border-radius: 5px;
	box-shadow:
		inset 0 30px 1px rgba(255, 255, 255, 0.25),
		inset 0 -1px 2px rgba(255, 255, 255, 0.5),
		inset 0  2px 3px rgba(  0,   0,   0, 0.40);
	font-size: 45px;
	line-height: 61px;
	text-align: center;
	white-space: nowrap;
	color: #333;
	cursor: default;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.01); /* for nicer/smoother rendering */
	background: #edefe0; /* Old browsers */
	background: -moz-linear-gradient(top,  #edefe0 45%, #babea2 80%); /* FF3.6+ */
	background: -webkit-gradient(linear, left top, left bottom, color-stop(45%,#edefe0), color-stop(80%,#babea2)); /* Chrome,Safari4+ */
	background: -webkit-linear-gradient(top,  #edefe0 45%,#babea2 80%); /* Chrome10+,Safari5.1+ */
	background: -o-linear-gradient(top,  #edefe0 45%,#babea2 80%); /* Opera 11.10+ */
	background: -ms-linear-gradient(top,  #edefe0 45%,#babea2 80%); /* IE10+ */
	background: linear-gradient(to bottom,  #edefe0 45%,#babea2 80%); /* W3C */
	filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#edefe0', endColorstr='#babea2',GradientType=0 ); /* IE6-9 */
}
.display-KHZ {
	position: absolute;
	bottom: 2px;
	font-size: 14px;
	line-height: 14px;
	right: 11px;
}
.tuner-small .display-KHZ {
	display: none;
}
.tuner-hold {
	position: absolute;
	right: 5px;
	bottom: 1px;
	font-size: 8px;
	line-height: 13px;
	color: #666;
	height: 12px;
}

/* ----- display helper buttons ----- */

.tuner-buttons {
	position: absolute;
	top: 2px;
	left: 2px;
	opacity: .35;
	height: 14px;
	width: 14px;
	transition:
		opacity 0.15s ease-in;
}
.tuner-buttons:hover {
	opacity: 0.75;
	height: 100%;
	width: 17px;
}
.tuner-buttons div {
	position: absolute;
	top: 1px;
	height: 11px;
	width: 11px;
	font-size: 8px;
	text-align: center;
	text-decoration: none;
	line-height: 12px;
	text-indent: 1px;
	color: #333;
	cursor: default;
	border-radius: 50%;
	border: 1px solid #444;
}
.tuner-buttons .tuner-smaller {
	opacity: 0;
}
.tuner-buttons .tuner-ln {
	font-size: 17px;
	line-height: 2px;
	overflow: hidden;
	opacity: 0;
}
.tuner-buttons:hover div {
	transition:
		opacity 0.15s ease-in,
		top 0.25s ease-out;
}

.tuner-buttons:hover .tuner-smaller {
	top: 15px;
	opacity: 0.75;
}
.tuner-buttons:hover .tuner-ln {
	top: 29px;
	opacity: 0.75;
}
.tuner-buttons .tuner-info:hover, .tuner-buttons .tuner-smaller:hover, .tuner-buttons .tuner-ln:hover {
	opacity: 1;
}

/* -------- key board -------- */

.tuner-dash {
	position: relative;
	float: left;
	width: 240px;
}

.tuner-small {
	display: none;
}

.tuner-main textarea {
	position: absolute;
	width: 1px;
	height: 1px;
	left: 4px;
	top: 4px;
	border: 0;
	background-color: transparent;
}

/* -------- key board keys -------- */

.tuner-dash > div {
	margin: 5px 4px;
	position: relative;
	width: 50px;
	height: 28px;
	background-color: #4c5356;
	border: 1px solid black;
	box-shadow: 0 1px rgba(255, 255, 255, 0.1);
	border-radius: 6px;
	overflow: hidden;
	float: left;
	cursor: default;
}
.tuner-dash > div > div {
	position: absolute;
	top: 0px;
	right: 0px;
	height: 28px;
	left: 0px;
	width: 100%;
	border: 1px solid #000;
	border-radius: 6px;
	color: #eee;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
	text-align: center;
	background: #656e72;
	
	border-top-left-radius: 6px;
	border-top-right-radius: 6px;
	border-bottom-left-radius: 26px 6px;
	border-bottom-right-radius: 26px 6px;
	box-shadow:
		inset 0 -15px 1px rgba(  0,   0,   0, 0.25),
		inset 0   1px 1px rgba(255, 255, 255, 0.4),
		inset 0   6px 6px rgba(255, 255, 255, 0.25);
	border: none;
}
.tuner-dash > div > div:hover {
	text-shadow:
		0px  0px  8px  rgb(255, 230, 186),
		0px  0px 22px  rgb(255, 255, 255),
		0px -1px  0px rgba(  0,   0,   0, 0.5);
}
.tuner-dash .tuner-eq {
	height: 68px;
	position: absolute;
	bottom: 0;
	right: 0;
	background-color: #EA6811;
}
.tuner-down {
	padding-top: 40px;
}
.tuner-radxy sup {
	padding-bottom: 4px;
	display: block;
	position: absolute;
	left: 14px;
	top: 6px;
}
.tuner-radxy em {
	font-weight: normal;
	font-size: 16px;
	padding-right: 2px;
}
.tuner-dash .btnWIDE {
	width: 80px;
}
.tuner-dash .btnWIDE div {
	text-align: left;
}
.tuner-dash .btnWIDE span {
	padding-left: 22px;
}
.tuner-blank {
	border-color: transparent;
	background: none;
	background-image: none;
	box-shadow: none;
	clear: right;
}
.tuner-dash .btnBROWN > div {
	background-color: #635045;
}
.tuner-dash .btnBROWN {
	background-color: #4b3c34;
}

.tuner-dash .btnBLACK > div {
	background-color: #000;
	box-shadow:
		inset 0 -13px 1px rgba(50,   50,  50, 0.5),
		inset 0   1px 1px rgba(255, 255, 255, 0.25),
		inset 0   8px 6px rgba(255, 255, 255, 0.2);
}
.tuner-dash .btnBLACK {
	background-color: #181818;
}
.tuner-dash .btnORANGE > div {
	background-color: #FF7113;
	box-shadow:
		inset 0 -13px 1px rgba(148,  77,  18, 0.20),
		inset 0  7px  6px rgba(255, 255, 255, 0.3),
		inset 0  6px  6px rgba(255, 255, 255, 0.1);
}
.tuner-dash > div:active,
.tuner-dash .tuner-press {
	box-shadow:
		inset 0 -9px 6px rgba(255, 255, 255, 0.35),
			  0  1px     rgba(255, 255, 255, 0.15);
}
.tuner-dash > div:active > div,
.tuner-dash .tuner-press > div {
	background: none;
	box-shadow:
		inset 0 1px 1px rgba(255, 255, 255, 0.3);
}
.tuner-dash .tuner-active {
	box-shadow:
		 1px  1px     rgb(220, 220, 240),
		-1px -1px     rgb(220, 220, 240),
		 1px -1px     rgb(220, 220, 240),
		-1px  1px     rgb(220, 220, 240),
		 2px  2px 2px rgb(220, 220, 240),
		-2px -2px 2px rgb(220, 220, 240),
		 2px -2px 2px rgb(220, 220, 240),
		-2px  2px 2px rgb(220, 220, 240);
	border-color: #333;
}

sup, sub {
	font-size: 10px;
	line-height: 0;
	padding-left: 1px;
}

/* --- TUNER HOUSING END --- */

		console.log("CMD: set: DEST =" + myContact.dstcall + "-" + myContact.dstssid);
		previous_operation = "COMMAND";
	
	} else if (msgPARSED[0] === ".macro1") {                 /*  Set Macro Button 1  */
		msgSUBPARSED = msgENTERED.replace('.macro1 ', '')
		myMacros[0] = msgSUBPARSED;
		message = "MACRO1 = " + myMacros[0];
		rxwinMSG(message);
		console.log("CMD: set: M1 =" + myMacros[0]);
		previous_operation = "COMMAND";
	
	} else if (msgPARSED[0] === ".macro2") {                 /*  Set Macro Button 2  */
		msgSUBPARSED = msgENTERED.replace('.macro2 ', '')
		myMacros[1] = msgSUBPARSED;
		message = "MACRO3 = " + myMacros[1];
		rxwinMSG(message);
		console.log("CMD: set: PANEL: btnM2: M2 = " + myMacros[1]);
		previous_operation = "COMMAND";
	
	} else if (msgPARSED[0] === ".macro3") {                 /*  Set Macro Button 3  */
		msgSUBPARSED = msgENTERED.replace('.macro3 ', '')
		myMacros[2] = msgSUBPARSED;
		message = "MACRO1 = " + myMacros[2];
		rxwinMSG(message);
		console.log("CMD: set: M3 = " + myMacros[2]);
		previous_operation = "COMMAND";
		
	} else if (msgPARSED[0] === ".macro4") {                 /*  Set Macro Button 4  */
		msgSUBPARSED = msgENTERED.replace('.macro4 ', '')
		myMacros[3] = msgSUBPARSED;
		message = "MACRO1 = " + myMacros[3];
		rxwinMSG(message);
		console.log("CMD: set: M4 = " + myMacros[3]);
		previous_operation = "COMMAND";

	/* Anything else is a message to be TX */
	} else {
		socket.send("TX:" + msgENTERED);
		rxwinMSG("TX:"+ msgENTERED);
		console.log("CMD: TX:" + msgENTERED);
		previous_operation = "SENT";
	}

	msgENTERED = "";
	msgPARSED = "";
	previous_operation = "SENT";
	document.getElementById('msgENTRY').value = "";

}

/* Establish Websocket */
socket = new WebSocket(wsURI);

socket.onopen = function(e) {
  console.log("ws: [open] Connection established");
  console.log("ws: Sending to server");
  socket.send("CONNECT:" + myHostname);
};

socket.onmessage = function(event) {
	var hasRXD = event.data.split(':');
	if (hasRXD[0] == "RX") {
		rxwinMSG("RX: " + hasRXD[1]);
		console.log("ws: RX: " + hasRXD[1]);
	};
	console.log(`ws: [message] Data received from server: ${event.data}`);
};

socket.onclose = function(event) {
  if (event.wasClean) {
    console.log(`ws: [close] Connection closed cleanly, code=${event.code} reason=${event.reason}`);
  } else {
    // e.g. server process killed or network down
    // event.code is usually 1006 in this case
    console.log('ws: [close] Connection died');
  }
};

socket.onerror = function(error) {
	var rxWINerror = "ws:ERROR connecting to " + wsURI;
	rxwinMSG(rxWINerror);
	console.log(`ws: [error] ${error.message}`);
};
