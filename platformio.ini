; HASviolet ESP32 - MVP
; Targets: Heltec WiFi LoRa 32 V2 (SX1276) and V3 (SX1262)
; All library versions are pinned so upstream releases cannot break the build.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =
	heltec_wifi_lora_32_V2

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
; Leave upload_port/monitor_port unset to auto-detect, or set per machine
; (e.g. /dev/ttyUSB0 for V2, /dev/ttyACM0 for V3) in platformio_override.ini
lib_deps =
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0
	links2004/WebSockets@2.7.3
	bblanchon/ArduinoJson@7.4.3
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit GFX Library@1.12.1
	adafruit/Adafruit SSD1306@2.5.15
build_flags =
	-I./src

; Heltec WiFi LoRa 32 V2 - ESP32 + SX1276 (also sold as HiLetgo ESP32 LoRa V2)
[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
upload_speed = 460800
build_flags =
	${env.build_flags}
	-DHASV_BOARD_V2
lib_deps =
	${env.lib_deps}
	sandeepmistry/LoRa@0.8.0

; Heltec WiFi LoRa 32 V3 - ESP32-S3 + SX1262 (native USB serial)
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
build_flags =
	${env.build_flags}
	-DHASV_BOARD_V3
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib@7.1.2
